version: '3.8'

services:
  blindpipe:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - BLINDPIPE_PORT=8080
      - BLINDPIPE_UPSTREAM_URL=https://api.openai.com
      - BLINDPIPE_ENABLE_REGEX=true
      - BLINDPIPE_ENABLE_NER=true
      - BLINDPIPE_NER_THRESHOLD=0.45
      - BLINDPIPE_SESSION_TTL=3600
      - RUST_LOG=info
    # Restrict memory as Rust uses <40MB normally
    deploy:
      resources:
        limits:
          memory: 256M
    restart: unless-stopped
